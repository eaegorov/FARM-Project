schema_version: farm.unified-viewer-registry.v1

# Paths are resolved relative to this registry.  Required FARM/source inputs
# fail closed.  Bridge/ShapeR/dense-lift outputs are optional and appear with
# an explicit unavailable reason until a derivative matches the exact current
# FARM success marker and source PLY fingerprint.
scenes:
  - scene_id: factory
    label: Factory
    farm_run: ../../../output/farm_pipeline/factory/runs/factory-production-v7-rescue
    source_ply: ../../../data/factory_3dgs_scene.ply
    source_fingerprint:
      algorithm: sha256
      digest: fdc6fc3fff65812234ee663bd8d42d48ba5a524ea0a9a429b4269e624bd3fe92
      size_bytes: 1411594650
    bridge_roots:
      - ../../../output/farm_shaper_bridge/factory
    dense_lift_roots:
      - ../../../output/farm_gaussian_lift/factory
    shaper_roots:
      - ../../../output/farm_shaper_bridge/factory
