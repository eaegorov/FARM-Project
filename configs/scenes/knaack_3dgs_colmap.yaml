schema_version: farm.scene.v1
scene_id: knaack

inputs:
  colmap_model: ../../../data/knaack_colmap_pinhole/sparse/0
  image_root: ../../../data/knaack_colmap_pinhole/images
  gaussian_ply: ../../../gcloud_splatica/pipeline-9389769e-9863-4c72-bb87-02d1ad9b3cdd/uuid500/gaussian_result/point_cloud_last.ply
output_root: ../../../output/farm_pipeline

camera:
  accepted_models: [PINHOLE]
  require_virtual_pinhole: true

camera_grouping:
  mode: regex
  pattern: '(?:^|/)(?P<camera>cam[0-9]+)_(?P<timestamp>[0-9]+)_(?P<view>center|yaw_left|yaw_right|pitch_up|pitch_down)[.](?:png|jpg|jpeg)$'
  timestamp_group: timestamp
  member_group: camera
  view_group: view
  required_members: [cam00, cam01]
  required_views: [center, yaw_left, yaw_right, pitch_up, pitch_down]

selection:
  # The geometric bridge pass may spend the headroom up to max_timestamps.
  # These values are finalized by a selector-only sweep before the full run.
  target_timestamps: 500
  max_timestamps: 700
  rotation_weight_m_per_rad: 0.5
  # The source capture has nine well-supported adjacent steps just above the
  # smaller factory-scene thresholds. These bounds cover that measured sensor
  # motion without weakening COLMAP track/overlap gates.
  max_motion_gap: 1.60
  max_translation_gap_m: 1.60
  max_rotation_gap_deg: 55.0
  min_shared_tracks: 20
  min_overlap_ratio: 0.015
  output_views: [center]

resources:
  profile: auto
  gpu: "0"
  model_manifest: ../models/farm_models.v1.json
  secrets_file: ../../../secrets.json
  render_resolution: 896
  depth_batch_size: 1
  mapping_batch_size: 2

models:
  segmentation: yoloe-v8l
  visual_features: dinov3-vits16plus
  caption: Qwen/Qwen3-VL-8B-Instruct
  offline: true

metric_scale:
  required: true
  source: rig_baseline
  # Physical dual-lens calibration rounded to 37.5 mm. The observed COLMAP
  # baseline is 0.037493270138 scene units and is constant to numerical noise.
  expected_baseline_m: 0.0375
  baseline_tolerance_m: 0.001
  baseline_members: [cam00, cam01]
  baseline_view: center

gravity:
  required: true
  mode: auto
  min_camera_consensus: 0.75

viewer:
  host: 0.0.0.0
  port: 8081
  scene_point_size_m: 0.004
  max_context_points: 1500000

preflight:
  image_check: all
  require_3dgs_schema: true
  min_registered_images: 2
  min_sparse_points: 10
  min_gaussians: 10
  alignment:
    sample_points: 65536
    nearest_neighbor_points: 4096
