services:
  scene-graph:
    user: "${FARM_UID:-1000}:${FARM_GID:-1000}"
    environment:
      HF_HOME: /home/scene_graph/.cache/huggingface
      HUGGINGFACE_HUB_CACHE: /home/scene_graph/.cache/huggingface/hub
      FARM_SECRETS_FILE: /run/secrets/farm-secrets.json
      VLLM_VL_MODEL: qwen3-vl-8b
      VLLM_CAPTION_MODEL: qwen3-vl-8b
      VLLM_EMBED_MODEL: qwen3-emb-0.6b
      VLLM_QWEN3_VL_EMBED_MODEL: qwen3-vl-emb-2b
    volumes:
      - ../../.cache/huggingface:/home/scene_graph/.cache/huggingface
      - ../../secrets.json:/run/secrets/farm-secrets.json:ro
      - ./factory-entrypoint.sh:/factory-entrypoint.sh:ro
    entrypoint: ["/factory-entrypoint.sh"]
